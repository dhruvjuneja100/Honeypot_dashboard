# ──────────────────────────────────────────────────────────────
# LOCAL / DEVELOPMENT (default profile)
# This file is used when you run the app locally on your PC.
# ──────────────────────────────────────────────────────────────
spring.application.name=dashboard

# MySQL – local database
spring.datasource.url=jdbc:mysql://localhost:3306/honeypot_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Async support (needed for @Async on LoggingService / AlertService)
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8

# Server port (can be overridden by environment variable PORT on cloud)
server.port=${PORT:8080}
