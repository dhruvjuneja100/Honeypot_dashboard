# ──────────────────────────────────────────────────────────────
# LOCAL / DEVELOPMENT (default profile)
# ──────────────────────────────────────────────────────────────
spring.application.name=dashboard

# MySQL – local database
spring.datasource.url=jdbc:mysql://localhost:3306/honeypot_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Async support
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8

# Server port
server.port=${PORT:8080}
