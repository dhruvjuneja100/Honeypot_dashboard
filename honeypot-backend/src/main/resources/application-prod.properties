# ──────────────────────────────────────────────────────────────
# PRODUCTION profile  (activated with: --spring.profiles.active=prod)
# Reads DB_URL, DB_USER, DB_PASS from environment variables.
# ──────────────────────────────────────────────────────────────

spring.application.name=dashboard

# Database Configuration
# Automatically detects driver and dialect based on JDBC URL
spring.datasource.url=${DB_URL:jdbc:h2:file:/tmp/honeypot_db;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}

# Connection pool settings
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Async thread pool
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16

# Server
server.port=${PORT:8080}

# Logging
logging.level.root=WARN
logging.level.com.honeypot=INFO
