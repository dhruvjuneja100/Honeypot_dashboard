# ──────────────────────────────────────────────────────────────
# PRODUCTION profile  (activated with: --spring.profiles.active=prod)
# All sensitive values are read from ENVIRONMENT VARIABLES —
# never hard-code passwords in this file.
# ──────────────────────────────────────────────────────────────

spring.application.name=dashboard

# ── MySQL (set these env-vars on your server / cloud platform) ─
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool (HikariCP defaults are good, just tighten timeouts)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10

# JPA / Hibernate
# "validate" – Hibernate checks schema matches entities but never changes it.
# Run schema migrations manually or use Flyway for production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Async thread pool
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16

# Server
server.port=${PORT:8080}

# Logging – only WARN and above in production (no noise)
logging.level.root=WARN
logging.level.com.honeypot=INFO
