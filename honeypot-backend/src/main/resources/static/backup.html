<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Backup Restore</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200 flex flex-col items-center justify-center h-screen font-sans">
    <div class="bg-white p-6 rounded shadow-md w-full max-w-sm border-t-4 border-yellow-500">
        <h2 class="text-lg font-bold text-gray-800 mb-2">System Restore Utility</h2>
        <p class="text-xs text-gray-500 mb-4">Enter the filename of the backup archive to restore the database.</p>
        
        <div id="result-message" class="hidden text-sm p-3 rounded mb-4 font-semibold text-center">
        </div>

        <form id="backupForm" class="space-y-4">
            <div>
                <label for="filename" class="block text-sm font-medium text-gray-700 mb-1">Backup Filename</label>
                <input type="text" id="filename" name="filename" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-yellow-500" placeholder="backup_2023_v1.tar.gz" required>
            </div>
            
            <button type="submit" class="w-full py-2 px-4 rounded text-sm font-medium text-white bg-yellow-600 hover:bg-yellow-700 focus:outline-none">
                Initialize Restore
            </button>
        </form>
    </div>

    <script>
        document.getElementById('backupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const filename = document.getElementById('filename').value;
            const formData = new URLSearchParams();
            formData.append('filename', filename);

            const msgBox = document.getElementById('result-message');
            msgBox.classList.remove('hidden', 'bg-red-100', 'text-red-700');
            msgBox.classList.add('bg-blue-100', 'text-blue-700');
            msgBox.innerText = "Processing request...";

            fetch('/backup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData.toString()
            })
            .then(response => response.json().catch(() => ({})))
            .then(data => {
                msgBox.classList.remove('bg-blue-100', 'text-blue-700');
                msgBox.classList.add('bg-red-100', 'text-red-700');
                msgBox.innerText = data.message || "Backup file not found.";
            })
            .catch(() => {
                msgBox.classList.remove('bg-blue-100', 'text-blue-700');
                msgBox.classList.add('bg-red-100', 'text-red-700');
                msgBox.innerText = "Error connecting to storage daemon.";
            });
        });
    </script>
</body>
</html>
