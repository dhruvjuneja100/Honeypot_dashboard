<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Root Admin Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-green-500 flex items-center justify-center h-screen font-mono">
    <div class="border border-green-500 p-8 w-full max-w-md shadow-lg shadow-green-900/50">
        <div class="text-center mb-6 border-b border-green-500 pb-4">
            <h1 class="text-2xl font-bold uppercase tracking-widest text-red-500">Restricted Access</h1>
            <p class="text-xs mt-2">Authorized Personnel Only. All activities are monitored.</p>
        </div>
        
        <div id="error-message" class="hidden bg-red-900 text-red-100 p-2 mb-4 text-sm text-center font-bold">
        </div>

        <form id="adminForm" class="space-y-6">
            <div>
                <label for="username" class="block text-sm mb-1">> root_id:</label>
                <input type="text" id="username" name="username" class="w-full bg-black border border-green-500 text-green-500 px-3 py-1 focus:outline-none focus:ring-1 focus:ring-green-400" required>
            </div>
            
            <div>
                <label for="password" class="block text-sm mb-1">> passkey:</label>
                <input type="password" id="password" name="password" class="w-full bg-black border border-green-500 text-green-500 px-3 py-1 focus:outline-none focus:ring-1 focus:ring-green-400" required>
            </div>
            
            <button type="submit" class="w-full border border-green-500 py-2 hover:bg-green-900 hover:text-white transition-colors uppercase tracking-widest text-sm">
                Authenticate
            </button>
        </form>
    </div>

    <script>
        document.getElementById('adminForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new URLSearchParams(new FormData(this));

            fetch('/admin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData.toString()
            })
            .then(response => response.json().catch(() => ({})))
            .then(data => {
                const msgBox = document.getElementById('error-message');
                msgBox.classList.remove('hidden');
                msgBox.innerText = "ERROR: " + (data.message || "Access denied.");
                document.getElementById('password').value = '';
            })
            .catch(() => {
                const msgBox = document.getElementById('error-message');
                msgBox.classList.remove('hidden');
                msgBox.innerText = "ERROR: Connection refused.";
            });
        });
    </script>
</body>
</html>
