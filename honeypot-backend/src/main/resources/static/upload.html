<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Upload Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen font-sans">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-2">Upload Files</h2>
        <p class="text-sm text-center text-gray-500 mb-6">Upload configuration or backup files here.</p>
        
        <div id="error-message" class="hidden bg-red-100 text-red-700 px-4 py-3 rounded mb-4 text-sm font-semibold">
        </div>

        <form id="uploadForm" class="space-y-4" enctype="multipart/form-data">
            <div class="border-2 border-dashed border-gray-300 rounded-md p-6 flex flex-col items-center">
                <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
                    <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <div class="flex text-sm text-gray-600 mt-2">
                    <label for="file" class="relative cursor-pointer bg-white rounded-md font-medium text-blue-600 hover:text-blue-500 focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-blue-500">
                        <span>Upload a file</span>
                        <input id="file" name="file" type="file" class="sr-only" required>
                    </label>
                    <p class="pl-1">or drag and drop</p>
                </div>
                <p class="text-xs text-gray-500 mt-1">ZIP, TAR, CONF up to 10MB</p>
            </div>
            
            <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                Submit Upload
            </button>
        </form>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);

            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json().catch(() => ({})))
            .then(data => {
                const msgBox = document.getElementById('error-message');
                msgBox.classList.remove('hidden');
                msgBox.innerText = data.message || "Upload directory not writable.";
            })
            .catch(() => {
                const msgBox = document.getElementById('error-message');
                msgBox.classList.remove('hidden');
                msgBox.innerText = "Upload failed due to server error.";
            });
        });
    </script>
</body>
</html>
