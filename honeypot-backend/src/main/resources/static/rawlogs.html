<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honeypot – Raw Logs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; }

        /* ── Sidebar nav ── */
        .nav-link {
            display: block;
            color: #94a3b8;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            transition: background-color 0.15s, color 0.15s;
            font-size: 0.9rem;
        }
        .nav-link:hover:not(.active) { background-color: #334155; color: #e2e8f0; }
        .nav-link.active            { background-color: #2563eb; color: #ffffff; font-weight: 600; }

        /* ── Badge helpers ── */
        .badge-high    { background: rgba(239,68,68,.15); color:#f87171; border:1px solid rgba(239,68,68,.3); padding:2px 8px; border-radius:4px; font-size:0.75rem; font-weight:700; }
        .badge-medium  { background: rgba(234,179,8,.15);  color:#facc15; border:1px solid rgba(234,179,8,.3);  padding:2px 8px; border-radius:4px; font-size:0.75rem; }
        .badge-safe    { background: rgba(34,197,94,.15);  color:#4ade80; border:1px solid rgba(34,197,94,.3);  padding:2px 8px; border-radius:4px; font-size:0.75rem; }
        .badge-unknown { background: #475569; color:#cbd5e1; padding:2px 8px; border-radius:4px; font-size:0.75rem; }

        ::-webkit-scrollbar       { width: 7px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-300 font-sans h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-60 bg-slate-800 border-r border-slate-700 flex flex-col shrink-0">
        <div class="h-16 flex items-center px-6 border-b border-slate-700">
            <h1 class="text-lg font-bold text-blue-400">🛡️ Honeypot UI</h1>
        </div>
        <nav class="flex-1 p-3 space-y-1">
            <a href="/dashboard.html" class="nav-link">📊 Dashboard</a>
            <a href="/rawlogs.html"   class="nav-link">📋 Raw Logs</a>
            <a href="/reports.html"   class="nav-link">🚨 Reports &amp; Alerts</a>
        </nav>
        <div class="p-4 border-t border-slate-700">
            <button id="logoutBtn" class="w-full bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-lg transition-colors text-sm">Logout</button>
        </div>
    </aside>

    <!-- Main -->
    <main class="flex-1 flex flex-col h-full overflow-hidden">

        <header class="h-16 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-8 shrink-0">
            <h2 class="text-lg font-semibold text-white">Raw Attack Logs</h2>
            <span class="flex items-center text-sm text-slate-400">
                <span class="w-2 h-2 rounded-full bg-green-500 mr-2 animate-pulse"></span> Live · refreshes every 15 s
            </span>
        </header>

        <div class="flex-1 overflow-y-auto p-8">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-base font-medium text-white">All Captured Requests</h3>
                    <div class="space-x-3">
                        <button id="exportCsvBtn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded shadow transition-colors text-sm font-medium">⬇ Export CSV</button>
                        <button id="exportPdfBtn" class="bg-red-600   hover:bg-red-700   text-white px-4 py-2 rounded shadow transition-colors text-sm font-medium">⬇ Export PDF</button>
                    </div>
                </div>

                <div class="overflow-x-auto rounded-lg border border-slate-700">
                    <table class="w-full text-left text-sm text-slate-400">
                        <thead class="text-xs text-slate-300 uppercase bg-slate-700 sticky top-0">
                            <tr>
                                <th class="px-6 py-3">Timestamp</th>
                                <th class="px-6 py-3">IP Address</th>
                                <th class="px-6 py-3">Attack Type</th>
                                <th class="px-6 py-3">Endpoint</th>
                                <th class="px-6 py-3">Location</th>
                                <th class="px-6 py-3 text-center">Threat Score</th>
                            </tr>
                        </thead>
                        <tbody id="logsTableBody" class="divide-y divide-slate-700">
                            <tr><td colspan="6" class="px-6 py-8 text-center text-slate-500">Loading…</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/rawlogs.js"></script>
</body>
</html>
