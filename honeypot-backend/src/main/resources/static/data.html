<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Data Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex flex-col items-center justify-center h-screen font-sans">
    <div class="bg-white p-8 rounded-lg shadow w-full max-w-lg border border-gray-200">
        <h2 class="text-xl font-semibold text-gray-800 mb-4 border-b pb-2">Customer Data Query System</h2>
        
        <div id="result-box" class="hidden bg-gray-900 text-green-400 font-mono text-sm p-4 rounded mb-4 overflow-auto max-h-40">
        </div>

        <form id="searchForm" class="space-y-4">
            <div>
                <label for="query" class="block text-sm font-medium text-gray-700 mb-1">Search Query (Name, ID, Email)</label>
                <input type="text" id="query" name="query" class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500" placeholder="e.g. John Doe" required>
            </div>
            
            <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none">
                Search Database
            </button>
        </form>
    </div>

    <script>
        document.getElementById('searchForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const query = document.getElementById('query').value;
            const formData = new URLSearchParams();
            formData.append('query', query);

            fetch('/api/data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData.toString()
            })
            .then(response => response.json().catch(() => ({})))
            .then(data => {
                const resultBox = document.getElementById('result-box');
                resultBox.classList.remove('hidden');
                resultBox.innerText = JSON.stringify(data, null, 2);
            })
            .catch(() => {
                const resultBox = document.getElementById('result-box');
                resultBox.classList.remove('hidden');
                resultBox.innerText = '{"status": "error", "message": "Query execution failed"}';
            });
        });
    </script>
</body>
</html>
